<!DOCTYPE html>

<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Càlcul de la posició d'un robot</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .equation {
      margin: 20px 0;
    }

    #output, #robotCanvas {
      display: none;
    }

    canvas {
      border: 1px solid black;
    }
  </style>
</head>

<body>

<!-- NAVBAR AFEGIDA -->
<nav class="navbar navbar-expand-lg navbar-light shadow sticky-top">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="logo.png" alt="Logo" class="logo rounded-circle me-2">
      <span class="fw-bold">Web de Roger Farràs</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="fa-solid fa-ship"></i> Nàutica
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="https://rfarras.github.io/vectors">Suma de vectors</a></li>
          </ul>
        </li>

      </ul>

      <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>
</nav>

<h1>Càlcul de la posició d'un robot amb dos braços</h1>

<div>
  <label>a₁:</label>
  <input type="number" id="a1" value="1"><br><br>

  <label>a₂:</label>
  <input type="number" id="a2" value="0.5"><br><br>

  <label>q₁:</label>
  <input type="number" id="q1" value="45"><br><br>

  <label>q₂:</label>
  <input type="number" id="q2" value="30"><br><br>

  <button onclick="calculatePosition()">Calcula</button>
</div>

<div id="output"></div>
<canvas id="robotCanvas" width="400" height="400"></canvas>

<script>
function calculatePosition() {
  let a1 = parseFloat(document.getElementById('a1').value);
  let a2 = parseFloat(document.getElementById('a2').value);
  let q1 = parseFloat(document.getElementById('q1').value) * Math.PI/180;
  let q2 = parseFloat(document.getElementById('q2').value) * Math.PI/180;

  document.getElementById('output').style.display = 'block';
  document.getElementById('robotCanvas').style.display = 'block';

  let x = a1*Math.cos(q1) + a2*Math.cos(q1+q2);
  let y = a1*Math.sin(q1) + a2*Math.sin(q1+q2);

  document.getElementById('output').innerHTML = "x=" + x.toFixed(2) + " y=" + y.toFixed(2);

  let ctx = document.getElementById('robotCanvas').getContext('2d');
  ctx.clearRect(0,0,400,400);

  ctx.beginPath();
  ctx.moveTo(200,200);
  ctx.lineTo(200 + x*80, 200 - y*80);
  ctx.stroke();
}
</script>

<!-- IMPORTANT perquè el menú funcioni -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
const themeToggle = document.getElementById('themeToggle');
const icon = themeToggle.querySelector('i');

themeToggle.onclick = () => {
  if(document.body.dataset.bsTheme === "dark"){
    document.body.dataset.bsTheme = "light";
    icon.classList = "fa-solid fa-moon";
  } else {
    document.body.dataset.bsTheme = "dark";
    icon.classList = "fa-solid fa-sun";
  }
}
</script>

</body>
